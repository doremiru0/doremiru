  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. アニメーションさせたい対象を取得
      const targets = document.querySelectorAll('.features-section, .image-placeholder-section');

      if (!targets.length) return;

      // 2. 画面監視用のオブザーバーを作成
      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          // 3. 要素が画面内に入ったら (isIntersecting)
          if (entry.isIntersecting) {
            // 4. .is-visible クラスを追加してアニメーションを実行
            entry.target.classList.add('is-visible');
            // 5. 一度表示したら、もう監視する必要はないので監視を解除
            obs.unobserve(entry.target);
          }
        });
      }, {
        root: null, // ビューポート（画面）を基準
        rootMargin: '0px',
        threshold: 0.1 // 要素が 10% 画面に入ったら実行
      });

      // 6. 全ての対象要素の監視を開始
      targets.forEach(target => {
        observer.observe(target);
      });
    });
  </script>
